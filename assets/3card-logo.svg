<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 297.5 160" role="img" aria-label="3Card">
<defs>
    <!-- Triangolo base equilatero (punta verso l'alto) -->
    <!-- Base: y=0 da -160 a 160. Punta: (0, -280) -->
    <polygon id="tri" points="0,-280 -160,0 160,0" fill="none" />

    <!-- T1 (Nero - Sinistra) -->
    <g id="t1"><use href="#tri" transform="translate(250, 490)" /></g>
    <!-- T2 (Verde - Centro/Alto) -->
    <g id="t2"><use href="#tri" transform="translate(400, 390)" /></g>
    <!-- T3 (Rosso - Destra) -->
    <g id="t3"><use href="#tri" transform="translate(550, 490)" /></g>

    <!-- Clip per le intersezioni dell'intreccio -->
    <clipPath id="clip-t1-over-t2">
      <circle cx="296.4" cy="291.25" r="55" />
    </clipPath>
    <clipPath id="clip-t2-over-t3">
      <circle cx="503.6" cy="291.25" r="55" />
    </clipPath>
  
