    <use href="#t1" stroke="#FFFFFF" stroke-width="40" />

    <!-- 2. T2 Verde (Sopra il Nero) -->
    <use href="#t2" stroke="#161615" stroke-width="60" />
    <use href="#t2" stroke="#19E67C" stroke-width="40" />

    <!-- 3. T3 Rosso (Sopra il Verde e il Nero) -->
    <use href="#t3" stroke="#161615" stroke-width="60" />
    <use href="#t3" stroke="#FF3B30" stroke-width="40" />

    <!-- INTRECCIO A: Riporta il Nero SOPRA il Verde (incrocio in alto a sinistra) -->
